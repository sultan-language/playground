<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملعب سلطان سي</title>
  <meta name="description" content="Write, check, run and build SultanC, in Arabic or English, entirely in your browser.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23d9b25f' stroke-width='2.4'%3E%3Crect x='7' y='7' width='18' height='18'/%3E%3Crect x='7' y='7' width='18' height='18' transform='rotate(45 16 16)'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="SultanC Playground">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="7" y="7" width="18" height="18"/>
        <rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)"/>
        <circle cx="16" cy="16" r="3.2"/>
      </svg>
      <span class="brand-name" data-t="title">ملعب سلطان سي</span>
    </a>

    <div class="controls">
      <div class="toggle" role="group" aria-labelledby="code-label">
        <span id="code-label" class="label" data-t="code">الشيفرة</span>
        <button data-surface="ar" aria-pressed="true">عربي</button>
        <button data-surface="en" aria-pressed="false">English</button>
      </div>
      <div class="toggle" role="group" aria-labelledby="msg-label">
        <span id="msg-label" class="label" data-t="messages">الرسائل</span>
        <button data-ui="ar" aria-pressed="true">عربي</button>
        <button data-ui="en" aria-pressed="false">English</button>
      </div>

      <div class="group">
        <button id="share" data-t="share">مشاركة</button>
        <button id="download" class="icon" data-title="download" aria-label="Download">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15h12"/></svg>
        </button>
        <button id="theme" class="icon" data-title="theme" aria-label="Theme">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 0 0 0 12z" class="fill"/></svg>
        </button>
        <button id="help" class="icon" data-title="shortcuts" aria-label="Help">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 7.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5V12"/><circle cx="10" cy="15" r=".6" class="fill"/></svg>
        </button>
      </div>
    </div>
    <div class="beam" aria-hidden="true"></div>
  </header>

  <main class="panes" id="panes">
    <section class="pane editor-pane">
      <div class="pane-head toolbar">
        <div class="group run-group">
          <button id="run" class="primary" disabled data-t="run">تشغيل</button>
          <button id="check" disabled data-t="check">فحص</button>
        </div>
        <div class="toggle" role="group" aria-labelledby="mode-label">
          <span id="mode-label" class="label" data-t="mode">النمط</span>
          <button data-mode="compile" aria-pressed="true" data-t="modeCompile">المترجم</button>
          <button data-mode="interpret" aria-pressed="false" data-t="modeInterpret">المفسر</button>
        </div>
        <label class="field" id="target-field"><span class="label" data-t="target">الهدف</span><select id="target"></select></label>
        <select id="examples" aria-label="Examples"></select>
        <span class="file-head"><span id="file-name" class="file-name">main.sn</span><span id="file-dirty" class="file-dirty" hidden></span></span>
      </div>
      <div id="editor" dir="rtl"></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize"></div>
    <section class="pane side-pane">
      <div class="pane-head tabs" role="tablist">
        <button type="button" role="tab" data-tab="output" aria-selected="true" data-t="output">الخرج</button>
        <button type="button" role="tab" data-tab="problems" aria-selected="false"><span data-t="problems">المشكلات</span> <span id="problem-count" class="badge"></span></button>
        <span class="tab-actions">
          <button type="button" id="term-copy" class="link" data-t="termCopy">نسخ</button>
          <button type="button" id="term-clear" class="link" data-t="termClear">مسح</button>
        </span>
      </div>
      <div id="output" class="terminal" role="log" aria-live="polite" dir="ltr"></div>
      <div id="problems" hidden></div>
      <details class="stdin" id="stdin-box">
        <summary data-t="input">الإدخال (stdin)</summary>
        <textarea id="stdin" rows="4" dir="auto"></textarea>
      </details>
    </section>
  </main>

  <footer class="foot">
    <span id="status" role="status"></span>
    <span class="spacer"></span>
    <span class="muted limits" data-t="limits">يعمل كل شيء داخل متصفحك.</span>
    <a class="muted" id="version-link" href="https://github.com/sultan-language/sultanc/releases"><span data-t="version">المترجم</span> <code id="version">…</code></a>
    <a class="muted" href="https://github.com/sultan-language/sultanc">GitHub</a>
  </footer>

  <dialog id="help-dialog" aria-labelledby="help-title">
    <form method="dialog">
      <h2 id="help-title" data-t="helpTitle">اختصارات</h2>
      <table class="keys">
        <tbody id="help-keys"></tbody>
      </table>
      <p class="muted" data-t="helpNote"></p>
      <button class="primary" value="close" data-t="close">إغلاق</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
